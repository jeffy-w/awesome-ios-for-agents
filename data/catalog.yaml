# Single source of truth for the human list (README) and the agent catalog (catalog.json).
# Edit this file, then run:  python3 scripts/refresh.py && python3 scripts/build.py
#
# This list states facts, not opinions:
#   does      what the project does, descriptively (no "best", "lightweight", "fast", ...)
#   note      an objective fact WITH a source link
#   native    Apple APIs for the same job: api, plus ios: / xcode: minimum, optional source
#   addon_of  the entry extends another entry; it is listed but not ranked
#   ranked    false = provider-specific SDKs (choose by service, not by stars); no ranking
#   kind      tool = developer tool or build plugin, never added as an app library dependency
#             (set on a section, or on a category to override)
#   products  override the SPM library products when Package.swift builds them dynamically;
#             products_source must link to where the names are documented
# Stars, release, last commit, min iOS, swift-tools-version and products are fetched by
# scripts/refresh.py. Status and rank are computed by scripts/build.py.
# One category = one purpose, so star counts inside a category are comparable.

sections:

  - id: foundation
    title: { en: Foundation, zh: 基础能力 }
    categories:

      - id: networking
        title: { en: HTTP client, zh: HTTP 客户端 }
        native:
          - { api: "URLSession async/await", ios: "15" }
        libs:
          - repo: Alamofire/Alamofire
            does: { en: "HTTP client with request interceptors, retry, multipart upload and progress.", zh: "HTTP 客户端，支持请求拦截、重试、multipart 上传和进度回调。" }
          - repo: kean/Get
            does: { en: "Typed API client built on URLSession.", zh: "基于 URLSession 的强类型 API 客户端。" }
          - repo: Moya/Moya
            addon_of: Alamofire/Alamofire
            does: { en: "Network abstraction layer built on Alamofire.", zh: "构建在 Alamofire 之上的网络抽象层。" }

      - id: openapi
        title: { en: OpenAPI client generation, zh: OpenAPI 客户端生成 }
        kind: tool
        libs:
          - repo: apple/swift-openapi-generator
            does: { en: "Generates a Swift client and server from an OpenAPI document at build time.", zh: "构建时根据 OpenAPI 文档生成 Swift 客户端和服务端代码。" }
            note:
              en: "README: a Swift package plugin and CLI. Generated code uses apple/swift-openapi-runtime and a ClientTransport such as apple/swift-openapi-urlsession."
              zh: "README：这是 Swift 包插件和命令行工具。生成的代码依赖 apple/swift-openapi-runtime，以及一个 ClientTransport 实现，例如 apple/swift-openapi-urlsession。"
              source: https://github.com/apple/swift-openapi-generator#package-ecosystem

      - id: websocket
        title: { en: WebSocket, zh: WebSocket }
        native:
          - { api: "URLSessionWebSocketTask", ios: "13" }
        libs:
          - repo: daltoniam/Starscream
            does: { en: "WebSocket client.", zh: "WebSocket 客户端。" }

      - id: reachability
        title: { en: Network reachability, zh: 网络状态监测 }
        native:
          - { api: "NWPathMonitor (Network framework)", ios: "12" }
        libs:
          - repo: ashleymills/Reachability.swift
            does: { en: "Network reachability notifications.", zh: "网络可达性变化通知。" }

      - id: images
        title: { en: Image loading & caching, zh: 图片加载与缓存 }
        native:
          - { api: "AsyncImage", ios: "15" }
        libs:
          - repo: onevcat/Kingfisher
            does: { en: "Downloads and caches remote images for UIKit and SwiftUI.", zh: "下载并缓存网络图片，支持 UIKit 和 SwiftUI。" }
          - repo: SDWebImage/SDWebImage
            does: { en: "Image downloader and cache, with coders for animated WebP, AVIF and HEIC.", zh: "图片下载与缓存，带动图 WebP、AVIF、HEIC 解码器。" }
          - repo: kean/Nuke
            does: { en: "Image loading pipeline with caching, prefetching and progressive decoding.", zh: "图片加载管线，支持缓存、预加载和渐进式解码。" }
          - repo: SDWebImage/SDWebImageSwiftUI
            addon_of: SDWebImage/SDWebImage
            does: { en: "SwiftUI views for SDWebImage.", zh: "SDWebImage 的 SwiftUI 视图组件。" }

      - id: database
        title: { en: Local database, zh: 本地数据库 }
        native:
          - { api: "SwiftData", ios: "17" }
          - { api: "Core Data", ios: "3" }
        libs:
          - repo: realm/realm-swift
            does: { en: "Object database for mobile.", zh: "面向移动端的对象数据库。" }
            note:
              en: "MongoDB: Atlas Device SDKs reached end-of-life and were removed on 2025-09-30; the on-device database continues to exist as an open source project."
              zh: "MongoDB：Atlas Device SDKs 已于 2025-09-30 终止并下线；设备端数据库继续作为开源项目存在。"
              source: https://www.mongodb.com/docs/device-sdks-deprecation/
          - repo: stephencelis/SQLite.swift
            does: { en: "Swift layer over SQLite3 with typed query expressions.", zh: "SQLite3 的 Swift 封装，用类型化表达式写查询。" }
          - repo: groue/GRDB.swift
            does: { en: "SQLite toolkit with migrations, record types and database observation.", zh: "SQLite 工具集，提供迁移、记录类型和数据库变化监听。" }
          - repo: pointfreeco/sqlite-data
            does: { en: "SwiftData-style models and queries on SQLite (GRDB), with CloudKit synchronization.", zh: "在 SQLite（GRDB）上提供类似 SwiftData 的模型和查询，支持 CloudKit 同步。" }

      - id: keychain
        title: { en: Keychain, zh: 钥匙串 }
        native:
          - { api: "Keychain Services (Security framework)", ios: "2" }
        libs:
          - repo: kishikawakatsumi/KeychainAccess
            does: { en: "Keychain wrapper.", zh: "钥匙串封装。" }
          - repo: square/Valet
            does: { en: "Keychain wrapper with iCloud keychain and Secure Enclave support.", zh: "钥匙串封装，支持 iCloud 钥匙串和 Secure Enclave。" }
          - repo: evgenyneu/keychain-swift
            does: { en: "Keychain wrapper.", zh: "钥匙串封装。" }
          - repo: auth0/SimpleKeychain
            does: { en: "Keychain wrapper.", zh: "钥匙串封装。" }

      - id: preferences
        title: { en: Preferences (UserDefaults), zh: 偏好设置（UserDefaults） }
        native:
          - { api: "UserDefaults", ios: "2" }
          - { api: "@AppStorage", ios: "14" }
        libs:
          - repo: sindresorhus/Defaults
            does: { en: "Typed, observable UserDefaults keys with Codable support.", zh: "强类型、可监听的 UserDefaults，支持 Codable。" }

  - id: architecture
    title: { en: Architecture, zh: 架构 }
    categories:

      - id: dependency-injection
        title: { en: Dependency injection, zh: 依赖注入 }
        libs:
          - repo: Swinject/Swinject
            does: { en: "Dependency injection container.", zh: "依赖注入容器。" }
          - repo: hmlongco/Factory
            does: { en: "Container-based dependency injection.", zh: "基于容器的依赖注入。" }
          - repo: pointfreeco/swift-dependencies
            does: { en: "Dependency management modelled on SwiftUI's environment.", zh: "参照 SwiftUI Environment 设计的依赖管理。" }

      - id: app-architecture
        title: { en: App architecture frameworks, zh: 应用架构框架 }
        native:
          - { api: "Observation (@Observable)", ios: "17" }
        libs:
          - repo: pointfreeco/swift-composable-architecture
            does: { en: "Unidirectional architecture for state, actions, effects and testing.", zh: "单向数据流架构，管理状态、动作、副作用和测试。" }

      - id: navigation
        title: { en: Navigation, zh: 导航 }
        native:
          - { api: "NavigationStack", ios: "16" }
        libs:
          - repo: pointfreeco/swift-navigation
            does: { en: "State-driven navigation tools for SwiftUI, UIKit and AppKit.", zh: "由状态驱动的导航工具，支持 SwiftUI、UIKit、AppKit。" }

  - id: observability
    title: { en: Observability, zh: 日志与监控 }
    categories:

      - id: logging
        title: { en: Logging, zh: 日志 }
        native:
          - { api: "os.Logger", ios: "14" }
        libs:
          - repo: CocoaLumberjack/CocoaLumberjack
            does: { en: "Logging framework with file logging and rotation.", zh: "日志框架，支持写文件和日志轮转。" }
          - repo: SwiftyBeaver/SwiftyBeaver
            does: { en: "Logging with console, file and cloud destinations.", zh: "日志库，可输出到控制台、文件和云端。" }
          - repo: apple/swift-log
            does: { en: "Logging API package for Swift on all platforms.", zh: "跨平台的 Swift 日志接口包。" }

      - id: network-debugging
        title: { en: Network & log inspector, zh: 网络与日志查看器 }
        libs:
          - repo: kean/Pulse
            does: { en: "In-app viewer for network requests and logs.", zh: "在 App 内查看网络请求和日志。" }

      - id: crash-reporting
        title: { en: Crash reporting, zh: 崩溃监控 }
        ranked: false
        native:
          - { api: "MetricKit MXCrashDiagnostic", ios: "14" }
          - { api: "Xcode Organizer crash reports" }
        libs:
          - repo: firebase/firebase-ios-sdk
            does: { en: "Firebase SDK; includes Crashlytics.", zh: "Firebase SDK，包含 Crashlytics。" }
          - repo: getsentry/sentry-cocoa
            does: { en: "Sentry SDK: crash reporting, error tracking and performance tracing.", zh: "Sentry SDK：崩溃上报、错误追踪和性能追踪。" }

      - id: analytics
        title: { en: Product analytics, zh: 产品数据分析 }
        ranked: false
        libs:
          - repo: firebase/firebase-ios-sdk
            does: { en: "Firebase SDK; includes Google Analytics for Firebase.", zh: "Firebase SDK，包含 Google Analytics for Firebase。" }
          - repo: TelemetryDeck/SwiftSDK
            does: { en: "TelemetryDeck analytics SDK.", zh: "TelemetryDeck 数据分析 SDK。" }
          - repo: PostHog/posthog-ios
            does: { en: "PostHog SDK: product analytics, feature flags and session replay.", zh: "PostHog SDK：产品分析、功能开关和会话回放。" }

  - id: business
    title: { en: Accounts & payments, zh: 账号与付费 }
    categories:

      - id: in-app-purchase
        title: { en: In-app purchases & subscriptions, zh: 应用内购买与订阅 }
        ranked: false
        native:
          - { api: "StoreKit 2", ios: "15" }
        libs:
          - repo: RevenueCat/purchases-ios
            does: { en: "RevenueCat SDK: purchases and subscriptions with server-side receipt validation and paywalls.", zh: "RevenueCat SDK：购买与订阅，提供服务端收据校验和付费墙。" }
          - repo: adaptyteam/AdaptySDK-iOS
            does: { en: "Adapty SDK: purchases and subscriptions with paywall A/B testing.", zh: "Adapty SDK：购买与订阅，提供付费墙 A/B 测试。" }

      - id: sign-in
        title: { en: Third-party sign-in, zh: 第三方登录 }
        ranked: false
        native:
          - { api: "Sign in with Apple (AuthenticationServices)", ios: "13" }
          - { api: "Passkeys (AuthenticationServices)", ios: "16" }
        libs:
          - repo: google/GoogleSignIn-iOS
            does: { en: "Sign in with Google.", zh: "Google 账号登录。" }
          - repo: auth0/Auth0.swift
            does: { en: "Auth0 authentication SDK.", zh: "Auth0 身份认证 SDK。" }

      - id: backend
        title: { en: Backend as a service, zh: 后端即服务 }
        ranked: false
        libs:
          - repo: firebase/firebase-ios-sdk
            does: { en: "Firebase SDK: Firestore, Auth, Storage, Functions and more.", zh: "Firebase SDK：Firestore、Auth、Storage、Functions 等。" }
          - repo: supabase/supabase-swift
            does: { en: "Supabase SDK: Postgres database, auth, storage and realtime.", zh: "Supabase SDK：Postgres 数据库、登录、存储和实时订阅。" }

  - id: ui
    title: { en: User interface, zh: 界面 }
    categories:

      - id: uikit-layout
        title: { en: UIKit Auto Layout DSL, zh: UIKit 自动布局 DSL }
        native:
          - { api: "NSLayoutAnchor", ios: "9" }
        libs:
          - repo: SnapKit/SnapKit
            does: { en: "DSL for Auto Layout constraints in code.", zh: "用代码写 Auto Layout 约束的 DSL。" }

      - id: swiftui-components
        title: { en: SwiftUI component collections, zh: SwiftUI 组件合集 }
        libs:
          - repo: SwiftUIX/SwiftUIX
            does: { en: "Collection of additional SwiftUI views and modifiers.", zh: "额外的 SwiftUI 视图和修饰符合集。" }

      - id: view-introspection
        title: { en: SwiftUI introspection, zh: SwiftUI 底层视图访问 }
        libs:
          - repo: siteline/swiftui-introspect
            does: { en: "Access the UIKit/AppKit view underneath a SwiftUI view.", zh: "获取 SwiftUI 视图底层对应的 UIKit/AppKit 视图。" }

      - id: popups
        title: { en: Popups & toasts, zh: 弹窗与 Toast }
        native:
          - { api: "fullScreenCover", ios: "14" }
        libs:
          - repo: exyte/PopupView
            does: { en: "Toasts, popups and floating sheets for SwiftUI.", zh: "SwiftUI 的 Toast、弹窗和浮动面板。" }

      - id: animation
        title: { en: Animation playback, zh: 动画播放 }
        native:
          - { api: "PhaseAnimator / KeyframeAnimator", ios: "17" }
        libs:
          - repo: airbnb/lottie-ios
            does: { en: "Plays Lottie (After Effects) animations.", zh: "播放 Lottie（After Effects 导出）动画。" }
          - repo: rive-app/rive-ios
            does: { en: "Plays Rive animations with state machines.", zh: "播放带状态机的 Rive 动画。" }

      - id: charts
        title: { en: Charts, zh: 图表 }
        native:
          - { api: "Swift Charts", ios: "16" }
        libs:
          - repo: ChartsOrg/Charts
            does: { en: "Chart library for UIKit (DGCharts).", zh: "UIKit 图表库（DGCharts）。" }

      - id: markdown-rendering
        title: { en: Markdown rendering, zh: Markdown 渲染 }
        native:
          - { api: "AttributedString(markdown:)", ios: "15" }
        libs:
          - repo: gonzalezreal/swift-markdown-ui
            does: { en: "Renders Markdown in SwiftUI.", zh: "在 SwiftUI 中渲染 Markdown。" }
            note:
              en: "README: \"MarkdownUI is in maintenance mode. New development is happening in Textual.\""
              zh: "README 原文：MarkdownUI 已进入维护模式，新开发在 Textual 中进行。"
              source: https://github.com/gonzalezreal/swift-markdown-ui#readme
          - repo: gonzalezreal/textual
            does: { en: "Renders Markdown and rich text in SwiftUI.", zh: "在 SwiftUI 中渲染 Markdown 和富文本。" }

      - id: html-parsing
        title: { en: HTML parsing, zh: HTML 解析 }
        libs:
          - repo: scinfu/SwiftSoup
            does: { en: "Parses and cleans HTML.", zh: "解析和清洗 HTML。" }

      - id: markdown-parsing
        title: { en: Markdown parsing, zh: Markdown 解析 }
        libs:
          - repo: swiftlang/swift-markdown
            does: { en: "Parses Markdown into a syntax tree.", zh: "把 Markdown 解析成语法树。" }

  - id: swift
    title: { en: Swift language & data, zh: Swift 语言与数据 }
    categories:

      - id: reactive
        title: { en: Reactive frameworks, zh: 响应式框架 }
        native:
          - { api: "Combine", ios: "13" }
        libs:
          - repo: ReactiveX/RxSwift
            does: { en: "Reactive programming with observables.", zh: "基于 Observable 的响应式编程。" }

      - id: async-operators
        title: { en: AsyncSequence operators, zh: AsyncSequence 操作符 }
        native:
          - { api: "AsyncSequence / AsyncStream (back-deployed to iOS 13 with Xcode 13.2+)", ios: "13" }
        libs:
          - repo: apple/swift-async-algorithms
            does: { en: "Operators for AsyncSequence: debounce, throttle, merge, zip and more.", zh: "AsyncSequence 操作符：debounce、throttle、merge、zip 等。" }

      - id: collections
        title: { en: Data structures, zh: 数据结构 }
        libs:
          - repo: apple/swift-collections
            products: [Collections]
            products_source: https://github.com/apple/swift-collections#readme
            does: { en: "Deque, OrderedSet, OrderedDictionary, Heap and more.", zh: "Deque、OrderedSet、OrderedDictionary、Heap 等数据结构。" }

      - id: algorithms
        title: { en: Sequence algorithms, zh: 序列算法 }
        libs:
          - repo: apple/swift-algorithms
            does: { en: "Sequence and collection algorithms (chunks, windows, uniqued, ...).", zh: "序列与集合算法（chunks、windows、uniqued 等）。" }

      - id: json
        title: { en: JSON, zh: JSON }
        native:
          - { api: "Codable + JSONDecoder (Swift 4)" }
        libs:
          - repo: SwiftyJSON/SwiftyJSON
            does: { en: "JSON access with subscripts.", zh: "用下标访问 JSON。" }

      - id: crypto
        title: { en: Cryptography, zh: 加密 }
        native:
          - { api: "CryptoKit", ios: "13" }
        libs:
          - repo: krzyzanowskim/CryptoSwift
            does: { en: "Crypto algorithms implemented in Swift.", zh: "用 Swift 实现的加密算法。" }
          - repo: apple/swift-crypto
            products: [Crypto, CryptoExtras]
            products_source: https://github.com/apple/swift-crypto#readme
            does: { en: "Open-source implementation of the CryptoKit API, including Linux.", zh: "CryptoKit 接口的开源实现，也支持 Linux。" }

      - id: protobuf
        title: { en: Protocol Buffers, zh: Protocol Buffers }
        libs:
          - repo: apple/swift-protobuf
            does: { en: "Protocol Buffers runtime and code generator for Swift.", zh: "Swift 的 Protocol Buffers 运行时和代码生成器。" }

  - id: testing
    title: { en: Testing, zh: 测试 }
    categories:

      - id: bdd
        title: { en: BDD test frameworks, zh: BDD 测试框架 }
        native:
          - { api: "Swift Testing", xcode: "16" }
          - { api: "XCTest" }
        libs:
          - repo: Quick/Quick
            does: { en: "BDD-style test framework.", zh: "BDD 风格的测试框架。" }

      - id: matchers
        title: { en: Test matchers, zh: 测试断言库 }
        native:
          - { api: "Swift Testing #expect / #require", xcode: "16" }
        libs:
          - repo: Quick/Nimble
            does: { en: "Matcher library for tests.", zh: "测试断言匹配库。" }

      - id: snapshot-testing
        title: { en: Snapshot testing, zh: 快照测试 }
        libs:
          - repo: pointfreeco/swift-snapshot-testing
            does: { en: "Snapshot testing for views and values.", zh: "对视图和数据做快照测试。" }

      - id: value-diff
        title: { en: Value dumps & diffs, zh: 数据输出与差异对比 }
        libs:
          - repo: pointfreeco/swift-custom-dump
            does: { en: "Dumps and diffs Swift values, for test failure messages.", zh: "输出 Swift 数据并对比差异，用于测试失败信息。" }

      - id: async-testing
        title: { en: Concurrency testing, zh: 并发代码测试 }
        libs:
          - repo: pointfreeco/swift-concurrency-extras
            does: { en: "Utilities for testing Swift concurrency code.", zh: "测试 Swift 并发代码的工具。" }

  - id: tooling
    title: { en: Tooling, zh: 工具链 }
    kind: tool
    categories:

      - id: lint
        title: { en: Linting, zh: 代码检查 }
        libs:
          - repo: realm/SwiftLint
            does: { en: "Enforces Swift style and conventions.", zh: "检查 Swift 代码风格和约定。" }

      - id: format
        title: { en: Formatting, zh: 代码格式化 }
        native:
          - { api: "xcrun swift-format (bundled with Xcode)", xcode: "16" }
        libs:
          - repo: nicklockwood/SwiftFormat
            does: { en: "Swift code formatter.", zh: "Swift 代码格式化工具。" }
          - repo: swiftlang/swift-format
            does: { en: "Swift code formatter from the Swift project.", zh: "Swift 项目维护的代码格式化工具。" }

      - id: project-generation
        title: { en: Project generation, zh: 工程生成 }
        libs:
          - repo: yonaskolb/XcodeGen
            does: { en: "Generates an Xcode project from project.yml.", zh: "根据 project.yml 生成 Xcode 工程。" }
          - repo: tuist/tuist
            does: { en: "Generates Xcode projects from Project.swift; also caching and build insights.", zh: "根据 Project.swift 生成 Xcode 工程，另有缓存和构建分析。" }

      - id: build-output
        title: { en: Build log formatting, zh: 构建日志格式化 }
        libs:
          - repo: cpisciotta/xcbeautify
            does: { en: "Formatter for xcodebuild output.", zh: "xcodebuild 输出格式化工具。" }

      - id: view-debugging
        title: { en: View debugging, zh: 界面调试 }
        native:
          - { api: "Xcode View Debugger (Debug View Hierarchy)" }
        libs:
          - repo: QMUI/LookinServer
            does: { en: "iOS framework for the Lookin macOS app: inspect and modify views in a running app.", zh: "配合 Lookin macOS 应用的 iOS 框架：查看和修改运行中 App 的视图。" }
          - repo: LookInsideApp/LookInside
            does: { en: "Mac app to inspect views, layers, frames and properties of a running iOS or macOS app.", zh: "Mac 应用，查看运行中 iOS 或 macOS App 的视图、图层、frame 和属性。" }
            note:
              en: "README: LookInside continues the work of Lookin; version 2.3.11 and later include a local MCP server for AI agents. The iOS side is integrated with the LookInside-Release package."
              zh: "README：LookInside 延续 Lookin 的工作；2.3.11 及以后的版本自带本地 MCP 服务，供 AI agent 使用。iOS 端通过 LookInside-Release 包接入。"
              source: https://github.com/LookInsideApp/LookInside#readme
          - repo: LookInsideApp/LookInside-Release
            addon_of: LookInsideApp/LookInside
            does: { en: "LookInside server package for iOS apps (Swift Package Manager or CocoaPods).", zh: "LookInside 的 iOS 端 server 包（支持 Swift Package Manager 和 CocoaPods）。" }

      - id: resource-codegen
        title: { en: Resource code generation, zh: 资源代码生成 }
        native:
          - { api: "Generated asset symbols (ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS)", xcode: "15" }
          - { api: "String Catalog symbols (STRING_CATALOG_GENERATE_SYMBOLS)", xcode: "26", source: "https://wwdcnotes.com/documentation/wwdc25-225-codealong-explore-localization-with-xcode/" }
        libs:
          - repo: SwiftGen/SwiftGen
            does: { en: "Generates Swift code for strings, images, fonts and other resources.", zh: "为字符串、图片、字体等资源生成 Swift 代码。" }
          - repo: mac-cain13/R.swift
            does: { en: "Generates typed resource accessors.", zh: "生成强类型资源访问代码。" }

      - id: release
